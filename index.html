<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>天堂經典交易平台</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { background-color: #020617; color: #f1f5f9; margin: 0; padding: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .glass-morphism { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(217, 119, 6, 0.15); }
    .item-card-shadow { box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); }

    @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    .animate-scroll { display: inline-block; white-space: nowrap; animation: scroll 35s linear infinite; }
    
    .loader-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.95); } }

    /* Webview 引導遮罩 */
    #webview-mask {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.98); z-index: 10000;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      padding: 2rem; text-align: center;
    }
  </style>

  <script>
    // --- 【關鍵修正】在頁面載入前，立刻偵測是否在 LINE 中，並強制跳轉至外部瀏覽器 ---
    (function() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isLine = /Line/i.test(ua);
      
      // 如果是 Line 且網址沒有跳轉參數，立刻補上參數並重新載入 (觸發跳出 Line)
      if (isLine && !window.location.search.includes('openExternalBrowser=1')) {
        const sep = window.location.href.includes('?') ? '&' : '?';
        window.location.href = window.location.href + sep + 'openExternalBrowser=1';
      }
    })();
  </script>
</head>

<body class="pb-28 overflow-x-hidden relative text-left">

  <!-- Line/FB 內建瀏覽器專用攔截遮罩 (如果自動跳轉失敗，作為備用) -->
  <div id="webview-mask">
    <div class="w-20 h-20 bg-amber-500/10 rounded-full flex items-center justify-center mb-6 border border-amber-500/20">
      <i data-lucide="external-link" class="text-amber-500 w-10 h-10 animate-bounce"></i>
    </div>
    <h2 class="text-2xl font-black text-white mb-4 italic">需切換瀏覽器開啟</h2>
    <p class="text-slate-400 mb-8 leading-relaxed">
      為保障 Google 帳號安全，<br/>內建瀏覽器無法進行驗證。<br/><br/>
      請點擊右上角 <span class="bg-slate-800 px-2 py-1 rounded text-white font-mono">···</span><br/>
      並選擇 <span class="text-amber-500 font-black underline">「使用預設瀏覽器開啟」</span>
    </p>
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex gap-3 items-start">
      <i data-lucide="shield-check" class="text-blue-500 w-5 h-5 shrink-0"></i>
      <p class="text-[10px] text-slate-500 text-left">切換後即可正常使用 Google 登入、刊登與下架功能。</p>
    </div>
  </div>

  <!-- Toast 通知容器 -->
  <div id="toast-container" class="fixed top-24 left-1/2 -translate-x-1/2 z-[1000] glass-morphism text-white px-6 py-3 rounded-full shadow-2xl font-bold text-sm flex items-center gap-2 transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-4">
    <i data-lucide="info" id="toast-icon" class="text-amber-500 w-4 h-4"></i>
    <span id="toast-msg">提示訊息</span>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-amber-900/40 shadow-xl text-left">
    <div class="px-4 py-3.5 flex items-center justify-between max-w-2xl mx-auto">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-amber-600 to-amber-900 rounded-lg flex items-center justify-center border border-amber-500/30">
          <i data-lucide="sword" class="text-white w-5 h-5"></i>
        </div>
        <div class="text-left">
          <h1 class="text-base font-black tracking-tighter bg-gradient-to-r from-amber-200 via-amber-400 to-amber-200 bg-clip-text text-transparent uppercase font-serif italic text-nowrap text-left">
            天堂經典平台
          </h1>
          <div class="flex items-center gap-2 text-left">
            <span id="authStatusDot" class="w-1.5 h-1.5 bg-slate-600 rounded-full"></span>
            <p id="authStatusText" class="text-[9px] text-slate-500 font-bold tracking-widest uppercase">載入身分中</p>
          </div>
        </div>
      </div>
      <div id="userProfileArea" class="flex items-center gap-3"></div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto p-4 space-y-4">
    
    <!-- 搜尋與篩選 -->
    <div class="bg-slate-900/60 border border-slate-800/80 p-5 rounded-[2rem] space-y-5 shadow-2xl text-left text-white">
      <div class="relative">
        <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-600 w-4 h-4"></i>
        <input type="text" id="searchInput" placeholder="搜尋裝備、魔法書、天幣..."
               class="w-full bg-slate-950 border border-slate-800 rounded-2xl py-3.5 pl-11 pr-4 text-sm focus:border-amber-600/50 outline-none transition-all placeholder:text-slate-700 font-medium text-white shadow-inner" />
      </div>
      <div id="serverFilterContainer" class="flex gap-2 overflow-x-auto pb-2 no-scrollbar w-full"></div>
    </div>

    <!-- 功能與排序列 -->
    <div class="flex items-center justify-between gap-4 bg-slate-900/40 p-3 rounded-2xl border border-slate-800/60 text-white">
      <div id="sortFilterContainer" class="flex gap-1.5 p-1 bg-slate-950/50 border border-slate-800 rounded-xl overflow-x-auto no-scrollbar shrink-0"></div>
      <div class="flex items-center gap-2 ml-auto text-white">
        <button onclick="window.openModal('safetyGuideModal')" class="bg-blue-900/20 text-blue-400 p-2 rounded-xl border border-blue-900/30 shadow-lg"><i data-lucide="shield-check" class="w-4 h-4"></i></button>
        <a id="lineGroupLink" href="#" target="_blank" class="hidden items-center gap-2 bg-[#06C755]/10 text-[#06C755] px-3 py-2 rounded-xl text-[11px] font-black border border-[#06C755]/30 shadow-lg whitespace-nowrap"><i data-lucide="message-square" class="w-3.5 h-3.5"></i> 專屬群</a>
      </div>
    </div>

    <div id="categoryTabsContainer" class="flex justify-between items-center bg-slate-900/40 rounded-2xl p-1.5 border border-slate-800/40 shadow-inner text-white"></div>

    <div class="flex items-center gap-2 px-1 text-left text-white">
      <h2 class="text-lg font-black text-slate-100 flex items-center gap-2">
        <i data-lucide="layout-dashboard" class="text-amber-500 w-5 h-5"></i>
        <span id="displayServerName">亞丁市集</span>
      </h2>
      <span id="displayItemCount" class="text-[10px] font-black text-slate-600 ml-auto py-1 px-3 bg-slate-900 rounded-full border border-slate-800 tracking-tighter uppercase">0 Items</span>
    </div>

    <!-- 商品列表 -->
    <div class="space-y-3.5 text-left text-white">
      <div id="adTopContainer" class="text-left text-white"></div>
      
      <div id="loadingIndicator" class="flex flex-col items-center justify-center py-24 text-slate-600 text-center">
        <div class="w-16 h-16 bg-amber-500/20 rounded-full flex items-center justify-center mb-4 border border-amber-500/30 loader-pulse mx-auto">
           <i data-lucide="loader-2" class="animate-spin text-amber-600 w-8 h-8"></i>
        </div>
        <p class="text-xs font-black tracking-widest uppercase opacity-50 text-center text-white">正在同步伺服器情報中...</p>
      </div>

      <div id="itemsContainer" class="space-y-3.5 hidden text-left text-white"></div>

      <div id="emptyState" class="hidden text-center py-24 border-2 border-dashed border-slate-900 rounded-[2.5rem] opacity-30 text-white">
        <i data-lucide="package" class="mx-auto mb-4 w-14 h-14"></i>
        <p class="font-black uppercase tracking-widest text-sm text-slate-500 text-center">目前尚無刊登資訊</p>
      </div>
    </div>
  </main>

  <!-- 刊登 FAB -->
  <div class="fixed bottom-10 left-0 right-0 flex justify-center z-30 pointer-events-none text-white">
    <button id="fabPostBtn" class="pointer-events-auto bg-gradient-to-b from-amber-400 to-amber-600 w-16 h-16 rounded-full shadow-[0_15px_45px_rgba(245,158,11,0.5)] border-4 border-slate-950 flex items-center justify-center active:scale-90 hover:scale-110 group transition-all text-center"><i data-lucide="plus-circle" class="text-slate-950 w-9 h-9 text-center"></i></button>
  </div>

  <!-- Modals -->
  <div id="loginPromptModal" class="hidden fixed inset-0 z-[600] flex items-center justify-center p-4 text-center">
    <div class="absolute inset-0 bg-slate-950/90 backdrop-blur-xl cursor-pointer" onclick="window.closeModal('loginPromptModal')"></div>
    <div class="relative w-full max-w-sm bg-slate-900 border border-amber-600/30 rounded-[2.5rem] p-10 shadow-2xl animate-in zoom-in duration-200 text-left">
      <i data-lucide="lock" class="text-amber-500 w-16 h-16 mx-auto mb-6"></i>
      <h3 class="text-2xl font-black text-white mb-3 font-serif text-center italic">驗證冒險者身分</h3>
      <p class="text-sm text-slate-400 mb-10 leading-relaxed font-medium text-center">刊登商品前需完成 Google 驗證。</p>
      <button onclick="window.handleLogin()" class="w-full py-4 rounded-2xl font-black bg-white text-slate-950 hover:bg-slate-200 active:scale-95 transition-all flex items-center justify-center gap-3 shadow-xl text-center"><img src="https://www.google.com/favicon.ico" class="w-5 h-5"> Google 快速驗證</button>
    </div>
  </div>

  <div id="postModal" class="hidden fixed inset-0 z-[550] flex items-center justify-center p-4"><div class="absolute inset-0 bg-slate-950/95 backdrop-blur-md"></div><form id="postForm" class="relative w-full max-w-md bg-slate-900 border border-amber-600/30 rounded-[2rem] shadow-2xl flex flex-col max-h-[94vh] overflow-hidden"><div class="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-900/50"><h2 class="font-black text-amber-500 text-lg font-serif italic"><i data-lucide="plus-circle" class="w-5 h-5 inline mr-2"></i>簽署刊登契約</h2><button type="button" onclick="window.closeModal('postModal')" class="text-slate-500"><i data-lucide="x" class="w-5 h-5"></i></button></div><div class="p-7 space-y-6 overflow-y-auto no-scrollbar text-left text-white"><div class="grid grid-cols-2 gap-4"><div class="space-y-1"><label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">目標伺服器</label><select id="formServer" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3.5 text-sm font-bold text-white"></select></div><div class="space-y-1"><label class="text-[10px] font-black text-slate-500 uppercase tracking-widest text-left">物件分類</label><select id="formType" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3.5 text-sm text-white"><option value="weapon">武器</option><option value="armor">防具</option><option value="item">道具/天幣</option><option value="magic">魔法/技能</option></select></div></div><div class="space-y-1 text-left"><label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">物品名稱</label><input type="text" id="formName" placeholder="如：+9 闊劍" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm font-bold text-white shadow-inner" /></div><div class="grid grid-cols-2 gap-4"><div class="space-y-1 text-left"><label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">計價類型</label><select id="formPriceType" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3.5 text-sm font-bold text-white"><option value="金幣">金幣</option><option value="台幣">台幣 (NT$)</option></select></div><div class="space-y-1 text-left"><label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">期望售價</label><input type="number" id="formPrice" placeholder="輸入數字" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm font-bold text-white shadow-inner text-left" /></div></div><div class="p-5 bg-blue-900/10 border border-blue-900/20 rounded-2xl space-y-4"><input type="text" id="formContactValue" placeholder="您的聯絡 ID (Line/Discord)" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-center font-mono font-bold text-white" /><input type="text" id="formSellerName" placeholder="顯示暱稱" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-center font-bold text-white" /></div><div id="termsCheckbox" class="p-4 rounded-xl border border-slate-800 bg-slate-900/50 cursor-pointer flex gap-3 items-start select-none hover:bg-slate-800"><div id="termsBoxUI" class="mt-0.5 w-5 h-5 rounded flex items-center justify-center border border-slate-600 bg-slate-950"><i data-lucide="check" id="termsCheckIcon" class="hidden text-slate-950 w-3.5 h-3.5 stroke-[4px]"></i></div><p class="text-[11px] text-slate-400 font-bold leading-relaxed">我已詳細閱讀<span class="text-amber-500 underline mx-1" onclick="event.stopPropagation(); window.openModal('termsModal')">服務規範</span>並同意資訊真實。</p></div></div><div class="p-6 bg-slate-900 border-t border-slate-800 text-center"><button type="submit" id="submitBtn" disabled class="w-full py-4.5 rounded-2xl font-black text-lg shadow-xl uppercase bg-slate-800 text-slate-500 cursor-not-allowed transition-all text-center">發布刊登</button></div></form></div>
  <div id="contactModal" class="hidden fixed inset-0 z-[500] flex items-center justify-center p-4 text-center"><div class="absolute inset-0 bg-slate-950/85 backdrop-blur-md cursor-pointer text-left text-white" onclick="window.closeModal('contactModal')"></div><div class="relative w-full max-w-sm bg-slate-900 border border-amber-900/40 rounded-[2.5rem] p-8 text-center shadow-2xl animate-in zoom-in duration-200 text-left"><div class="flex justify-between items-start mb-8 text-left text-white"><div class="text-left text-white text-left"><h3 class="text-2xl font-black text-amber-500 italic">聯繫冒險者</h3><p class="text-[10px] text-slate-500 uppercase mt-1">Safe Trade Protocol</p></div><button onclick="window.closeModal('contactModal')" class="bg-slate-800 p-2 rounded-full text-slate-500"><i data-lucide="x" class="w-5 h-5"></i></button></div><div class="bg-slate-950 border border-slate-800 rounded-3xl p-8 mb-8 shadow-inner"><span class="text-[10px] font-black text-slate-500 uppercase block mb-3 text-center">聯絡方式</span><p id="contactValueDisplay" class="text-3xl font-mono font-black text-white mb-8 select-all text-center">---</p><button id="copyBtn" class="w-full py-4.5 rounded-2xl font-black bg-amber-600 text-slate-950 flex items-center justify-center gap-2 active:scale-95 text-center transition-all"><i data-lucide="copy" class="w-5 h-5"></i><span id="copyText">複製 ID</span></button></div><p class="text-[10px] text-red-400 font-black px-4 italic text-center">⚠️ 面交時請務必核對遊戲內「角色暗號」！</p></div></div>
  <div id="deleteModal" class="hidden fixed inset-0 z-[600] flex items-center justify-center p-4 text-center text-white"><div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm cursor-pointer" onclick="window.closeModal('deleteModal')"></div><div class="relative w-full max-w-sm bg-slate-900 border border-red-900/50 rounded-3xl p-8 text-center shadow-2xl text-white"><i data-lucide="trash-2" class="text-red-500 w-12 h-12 mx-auto mb-4 text-center text-white"></i><h3 class="text-xl font-black text-white mb-2 italic text-red-500 text-center">撤銷刊登？</h3><div class="flex gap-3 text-center mt-6 text-white"><button onclick="window.closeModal('deleteModal')" class="flex-1 py-4 rounded-xl font-bold text-slate-400 bg-slate-800 text-white">保留</button><button id="confirmDeleteBtn" class="flex-1 py-4 rounded-xl font-black text-white bg-red-600 shadow-lg text-white">下架</button></div></div></div>

  <!-- ================= 邏輯程式碼 ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    // 💡 關鍵修正：換回 signInWithPopup，因為我們已經把玩家逼出 Line 瀏覽器了，用 Popup 才不會導致迴圈重整遺失登入狀態
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // Firebase 配置
    const firebaseConfig = {
      apiKey: "AIzaSyCX-L5gvdLxrNEsEisdtEzud_v-sWeMpmw",
      authDomain: "lineage-market.firebaseapp.com",
      projectId: "lineage-market",
      storageBucket: "lineage-market.firebasestorage.app",
      messagingSenderId: "903245014530",
      appId: "1:903245014530:web:06412f33431e655dcda91b"
    };

    const PLATFORM_APP_ID = 'lineage-classic-web-v3'; 
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const EXPIRE_MS = 7 * 24 * 60 * 60 * 1000;
    const servers = ['全部', '太陽神阿波羅', '愛神邱比特', '勝利女神雅典娜', '美神維納斯', '天神宙斯', '天后海拉', '戰神馬爾斯', '月亮女神阿緹蜜斯', '海神波塞頓', '水蛇許德拉', '冥王黑帝斯', '火神赫發斯特斯', '收獲女神', '蛇髮女', '半人馬'];
    const categories = [{id:'all',label:'全部',icon:'package'},{id:'weapon',label:'武器',icon:'sword'},{id:'armor',label:'防具',icon:'shield'},{id:'item',label:'道具/天幣',icon:'coins'},{id:'magic',label:'魔法',icon:'wand-2'}];
    
    const state = { user: null, items: [], activeTab: 'all', searchQuery: '', selectedServer: '全部', deleteTargetId: null };
    const el = (id) => document.getElementById(id);

    // 檢查 Webview 並顯示提示
    function checkWebViewAndShowMask() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isWebview = /Line|FBAN|FBAV|Instagram/i.test(ua);
      // 如果還是在內建瀏覽器 (代表自動跳轉失敗，如 IG/FB)，強制顯示黑畫面引導
      if (isWebview) {
         el('webview-mask').style.display = 'flex';
         lucide.createIcons();
      }
    }

    // --- 全局功能掛載 ---
    window.openModal = (id) => el(id)?.classList.remove('hidden');
    window.closeModal = (id) => el(id)?.classList.add('hidden');
    
    // 💡 關鍵修正：改回使用 signInWithPopup，這能徹底解決輸入密碼後卡在迴圈或沒登入的狀況
    window.handleLogin = async () => {
      try {
        showToast("正在開啟 Google 驗證...");
        await signInWithPopup(auth, provider);
        window.closeModal('loginPromptModal');
        showToast("登入成功！");
      } catch (e) {
        console.error(e);
        if (e.message.includes('disallowed_useragent') || e.code === 'auth/unauthorized-domain') {
           el('webview-mask').style.display = 'flex'; // 被擋住時提示切換瀏覽器
           lucide.createIcons();
        } else {
           showToast("登入失敗，請重試");
        }
      }
    };

    window.handleLogout = async () => { await signOut(auth); showToast("已登出"); };
    window.executeDelete = async () => {
      if(!state.deleteTargetId || !state.user) return;
      try {
        await deleteDoc(doc(db, 'artifacts', PLATFORM_APP_ID, 'public', 'data', 'listings', state.deleteTargetId));
        showToast('掛單已成功撤回');
        window.closeModal('deleteModal');
      } catch(e) { showToast('下架失敗：權限不足'); }
    };

    window.toggleFormClass = (cls) => { /* 保留職業選擇 logic... */ };
    window.setContactType = (type) => { /* 保留 Line/Discord 切換 logic... */ };
    window.openDeleteModal = (id) => { state.deleteTargetId = id; window.openModal('deleteModal'); };

    async function init() {
      checkWebViewAndShowMask();
      renderStaticUI();
      
      onAuthStateChanged(auth, (u) => { 
        state.user = u; 
        updateAuthUI(); 
        updateUI(); 
      });
      
      const colRef = collection(db, 'artifacts', PLATFORM_APP_ID, 'public', 'data', 'listings');
      
      // 處理資料庫讀取超時
      const loadTimer = setTimeout(() => {
        if (el('loadingIndicator') && !el('loadingIndicator').classList.contains('hidden')) {
           el('loadingIndicator').classList.add('hidden');
           showToast("同步超時：請確認資料庫規則 (Rules) 已發布");
        }
      }, 6000);

      onSnapshot(colRef, (snap) => {
        clearTimeout(loadTimer);
        state.items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (el('loadingIndicator')) el('loadingIndicator').classList.add('hidden');
        updateUI();
      }, (err) => {
        console.error(err);
        showToast("資料庫連線失敗：請檢查規則 (Rules)");
      });

      el('searchInput')?.addEventListener('input', (e) => { state.searchQuery = e.target.value; updateUI(); });
      el('postForm')?.addEventListener('submit', handlePostSubmit);
      el('termsCheckbox')?.addEventListener('click', toggleTerms);
      el('confirmDeleteBtn')?.addEventListener('click', window.executeDelete);
      el('copyBtn')?.addEventListener('click', handleCopy);
      el('fabPostBtn')?.addEventListener('click', () => { if (!state.user) window.openModal('loginPromptModal'); else window.openModal('postModal'); });
    }

    function updateAuthUI() {
      const area = el('userProfileArea'), dot = el('authStatusDot'), text = el('authStatusText');
      if (!area || !dot || !text) return;
      if (state.user) {
        dot.className = "w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse";
        text.innerText = state.user.displayName;
        area.innerHTML = `<button onclick="window.handleLogout()" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-[10px] font-black text-slate-500 transition-colors">登出</button><img src="${state.user.photoURL}" referrerpolicy="no-referrer" class="w-8 h-8 rounded-full border border-amber-600/40 ring-2 ring-amber-600/10">`;
      } else {
        dot.className = "w-1.5 h-1.5 bg-slate-500 rounded-full";
        text.innerText = "訪客模式";
        area.innerHTML = `<button onclick="window.handleLogin()" class="bg-amber-600 hover:bg-amber-500 text-slate-950 px-3.5 py-1.5 rounded-lg border border-amber-500/30 text-[11px] font-black flex items-center gap-2 shadow-lg transition-all"><i data-lucide="log-in" class="w-3.5 h-3.5"></i> 驗證登入</button>`;
      }
      lucide.createIcons();
    }

    function renderStaticUI() {
      el('serverFilterContainer').innerHTML = servers.map(s => `<button data-type="server" data-val="${s}" class="filter-btn px-4 py-2 rounded-xl text-[11px] font-black whitespace-nowrap shrink-0 border border-slate-800 transition-all text-white text-left text-white">${s}</button>`).join('');
      el('formServer').innerHTML = servers.filter(s=>s!=='全部').map(s => `<option value="${s}">${s}</option>`).join('');
      el('categoryTabsContainer').innerHTML = categories.map(cat => `<button data-type="category" data-val="${cat.id}" class="filter-btn flex-1 flex flex-col items-center py-3 gap-1.5 rounded-2xl transition-all text-white text-left text-white"><i data-lucide="${cat.icon}" class="w-5 h-5 text-white"></i><span class="text-[10px] font-black tracking-widest text-white">${cat.label}</span></button>`).join('');
      el('sortFilterContainer').innerHTML = [{id:'newest',label:'最新'},{id:'priceAsc',label:'低價'},{id:'priceDesc',label:'高價'}].map(o => `<button data-type="sort" data-val="${o.id}" class="filter-btn px-3 py-1.5 rounded-lg text-[11px] font-black transition-all border-0 text-white text-left">${o.label}</button>`).join('');
      document.querySelectorAll('.filter-btn').forEach(btn => { btn.addEventListener('click', (e) => { const {type,val} = e.currentTarget.dataset; if (type==='server') state.selectedServer = val; if (type==='category') state.activeTab = val; if (type==='sort') state.sortBy = val; updateUI(); }); });
      lucide.createIcons();
    }

    function updateUI() {
      const now = Date.now();
      let filtered = state.items.filter(item => {
        if (item.createdAt) { const itemTime = item.createdAt.seconds ? item.createdAt.seconds * 1000 : item.createdAt; if ((now - itemTime) > EXPIRE_MS) return false; }
        if (state.activeTab !== 'all' && item.type !== state.activeTab) return false;
        if (state.searchQuery && !String(item.name).toLowerCase().includes(state.searchQuery.toLowerCase())) return false;
        if (state.selectedServer !== '全部' && item.server !== state.selectedServer) return false;
        return true;
      });
      filtered.sort((a,b) => { if (state.sortBy === 'newest') return (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0); if (state.sortBy === 'priceAsc') return a.price - b.price; if (state.sortBy === 'priceDesc') return b.price - a.price; return 0; });
      if(el('displayServerName')) el('displayServerName').innerText = state.selectedServer;
      if(el('displayItemCount')) el('displayItemCount').innerText = `${filtered.length} ITEMS`;
      const container = el('itemsContainer'), emptyState = el('emptyState');
      if (container && emptyState) {
        if (filtered.length > 0) { container.classList.remove('hidden'); emptyState.classList.add('hidden'); container.innerHTML = filtered.map((item) => generateItemHTML(item)).join(''); }
        else { container.classList.add('hidden'); emptyState.classList.remove('hidden'); }
      }
      updateFilterButtonStyles(); lucide.createIcons();
    }

    function generateItemHTML(item) {
      const isOwner = !!(state.user && state.user.uid === item.userId);
      const timeStr = item.createdAt ? formatTime(item.createdAt.seconds * 1000) : '剛剛';
      return `
        <div class="bg-slate-900/90 border rounded-2xl p-4 flex justify-between items-center text-left ${isOwner ? 'border-blue-900 bg-blue-950/20 shadow-lg' : 'border-slate-800'}">
          <div class="flex gap-4 items-center flex-1 min-w-0">
            <div class="w-14 h-14 rounded-2xl bg-slate-950 border-2 flex items-center justify-center shrink-0 border-slate-800 text-left"><i data-lucide="${item.type==='weapon'?'sword':item.type==='armor'?'shield':item.type==='item'?'coins':'wand-2'}" class="w-7 h-7 text-left"></i></div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2"><span class="text-[9px] font-black px-1.5 py-0.5 bg-amber-900/30 text-amber-500 rounded border border-amber-900/40 uppercase shrink-0 text-left text-white">${item.server}</span><h3 class="font-bold text-slate-100 text-[15px] truncate text-left text-white">${item.name}</h3></div>
              <div class="flex items-center gap-2 mt-2 w-full overflow-hidden text-left"><span class="text-[9px] text-slate-500 font-bold shrink-0 text-left">${timeStr}</span><span class="text-[11px] text-slate-400 truncate text-left">賣家: ${escapeHtml(item.sellerName || '冒險者')} ${isOwner ? '(您)':''}</span></div>
            </div>
          </div>
          <div class="text-right shrink-0 pl-2">
            <p class="text-lg font-black text-amber-400 tracking-tight">${Number(item.price).toLocaleString()} <span class="text-[10px] font-bold opacity-60 text-white">${item.priceType || '金幣'}</span></p>
            ${isOwner ? `<button onclick="window.openDeleteModal('${item.id}')" class="mt-2 bg-slate-800 text-red-400 border border-slate-700 text-[10px] px-3.5 py-1 rounded-xl font-black">下架</button>` : `<button onclick="window.openContactModalById('${item.id}')" class="mt-2 bg-amber-600 text-slate-950 text-[11px] px-4 py-1.5 rounded-xl font-black shadow-lg">聯絡</button>`}
          </div>
        </div>`;
    }

    window.openContactModalById = (id) => { const item = state.items.find(x => x.id === id); if(!item) return; state.contactTarget = item; el('contactValueDisplay').innerText = item.contactValue; window.openModal('contactModal'); lucide.createIcons(); };
    function formatTime(ms) { const diff = (Date.now() - ms) / 1000; if (diff < 60) return '剛剛'; if (diff < 3600) return Math.floor(diff/60) + '分鐘前'; return Math.floor(diff/3600) + '小時前'; }
    function updateFilterButtonStyles() { document.querySelectorAll('.filter-btn').forEach(btn => { const {type,val} = btn.dataset; let isActive = (type==='server'&&state.selectedServer===val) || (type==='category'&&state.activeTab===val) || (type==='sort'&&state.sortBy===val); if(type==='server') { btn.className = `filter-btn px-4 py-2 rounded-xl text-[10px] font-black whitespace-nowrap shrink-0 border border-slate-800 transition-all ${isActive ? 'bg-amber-600/20 text-amber-400 border-amber-600/50 shadow-inner' : ''}`; } else if(type==='category') { btn.className = `filter-btn flex-1 flex flex-col items-center py-3 gap-1.5 rounded-2xl transition-all ${isActive ? 'bg-slate-800 text-amber-400 shadow-lg scale-105 z-10' : 'text-slate-600'}`; } else { btn.className = `filter-btn px-3.5 py-1.5 rounded-lg text-[10px] font-black border border-slate-800 transition-all ${isActive ? 'bg-amber-600 text-slate-950 border-amber-600 shadow-md scale-105' : 'bg-slate-800/50 text-slate-500'}`; } }); }
    function toggleTerms() { state.agreedToTerms = !state.agreedToTerms; const box=el('termsBoxUI'), icon=el('termsCheckIcon'), btn=el('submitBtn'); if (state.agreedToTerms) { box?.classList.replace('bg-slate-950','bg-amber-500'); icon?.classList.remove('hidden'); btn.disabled=false; btn.className='w-full py-4.5 rounded-2xl font-black text-lg shadow-xl bg-gradient-to-r from-amber-500 to-amber-700 text-slate-950 text-center'; } else { box?.classList.replace('bg-amber-500','bg-slate-950'); icon?.classList.add('hidden'); btn.disabled=true; btn.className='w-full py-4.5 rounded-2xl font-black text-lg bg-slate-800 text-slate-500 cursor-not-allowed text-center'; } }
    async function handlePostSubmit(e) { e.preventDefault(); if (!state.user || !state.agreedToTerms) return; const btn=el('submitBtn'); btn.innerText='正在發送...'; btn.disabled=true; const data = { server: el('formServer').value, type: el('formType').value, name: el('formName').value, level: 0, rarity: 'common', price: Number(el('formPrice').value), priceType: el('formPriceType').value, contactType: 'Line', contactValue: el('formContactValue').value, sellerName: el('formSellerName').value, createdAt: serverTimestamp(), userId: state.user.uid, userEmail: state.user.email, isVerified: false }; try { await addDoc(collection(db, 'artifacts', PLATFORM_APP_ID, 'public', 'data', 'listings'), data); window.closeModal('postModal'); el('postForm').reset(); showToast('刊登成功！'); } catch (err) { alert("發布失敗，請確認資料庫權限設定"); } finally { btn.innerText='發布刊登'; btn.disabled=false; } }
    async function handleCopy(){ if(!state.contactTarget)return; const t=state.contactTarget.contactValue; try { await navigator.clipboard.writeText(t); } catch(e) { const input=document.createElement("input"); input.value=t; document.body.appendChild(input); input.select(); document.execCommand("copy"); document.body.removeChild(input); } el('copyBtn').className='w-full py-4.5 rounded-2xl font-black bg-green-600 text-white flex items-center justify-center gap-2 shadow-lg text-center'; el('copyText').innerText='複製成功！'; }
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])); }
    let toastT; function showToast(m){ const t=el('toast-container'); if(!t) return; el('toast-msg').innerText=m; t.classList.remove('opacity-0','-translate-y-4','pointer-events-none'); t.classList.add('opacity-100','translate-y-0'); clearTimeout(toastT); toastT=setTimeout(()=>{t.classList.add('opacity-0','-translate-y-4','pointer-events-none'); t.classList.remove('opacity-100','translate-y-0');},3000); }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
