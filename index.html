    const classes = [{id:'全部',label:'全職',icon:'users'},{id:'王族',label:'王族',icon:'crown'},{id:'騎士',label:'騎士',icon:'sword'},{id:'妖精',label:'妖精',icon:'zap'},{id:'魔法師',label:'法師',icon:'flame'}];
    const categories = [{id:'all',label:'全部',icon:'package'},{id:'weapon',label:'武器',icon:'sword'},{id:'armor',label:'防具',icon:'shield'},{id:'item',label:'道具/天幣',icon:'coins'},{id:'magic',label:'魔法',icon:'wand-2'}];
    
    const adsConfig = {
      listTop: { imageUrl: "", link: "https://line.me/ti/p/~remixroy" },
      listInterleaved: { imageUrl: "", link: "https://line.me/ti/p/~remixroy" }
    };

    const state = { user: null, items: [], activeTab: 'all', searchQuery: '', selectedServer: '全部', selectedClass: '全部', sortBy: 'newest', currentPage: 1, itemsPerPage: 10, agreedToTerms: false, postFormClasses: ['王族', '騎士', '妖精', '魔法師'], contactType: 'Line', deleteTargetId: null, contactTarget: null };
    const el = (id) => document.getElementById(id);

    // --- 全局掛載函數 ---
    window.openModal = (id) => el(id)?.classList.remove('hidden');
    window.closeModal = (id) => el(id)?.classList.add('hidden');
    window.handleLogin = async () => { try { await signInWithRedirect(auth, provider); } catch (e) { showToast("登入受阻，請在外部瀏覽器開啟"); } };
    window.handleLogout = async () => { await signOut(auth); showToast("已安全登出"); };
    window.executeDelete = async () => { if(!state.deleteTargetId || !state.user) return; try { await deleteDoc(doc(db, 'artifacts', PLATFORM_APP_ID, 'public', 'data', 'listings', state.deleteTargetId)); showToast('下架成功'); window.closeModal('deleteModal'); } catch(e) { showToast('下架失敗'); } };
    window.setContactType = (type) => { state.contactType = type; if(el('formContactValue')) el('formContactValue').placeholder = `您的 ${type} ID`; el('btnContactLine').className = type==='Line' ? 'flex-1 py-2 text-[10px] font-black rounded-lg bg-amber-600 text-slate-950 text-center' : 'flex-1 py-2 text-[10px] font-black rounded-lg text-slate-500 text-center'; el('btnContactDiscord').className = type==='Discord' ? 'flex-1 py-2 text-[10px] font-black rounded-lg bg-amber-600 text-slate-950 text-center' : 'flex-1 py-2 text-[10px] font-black rounded-lg text-slate-500 text-center'; };
    window.toggleFormClass = (cls) => { const idx = state.postFormClasses.indexOf(cls); if (idx > -1) state.postFormClasses.splice(idx,1); else state.postFormClasses.push(cls); updateFormClassStyles(); };
    window.openDeleteModal = (id) => { state.deleteTargetId = id; window.openModal('deleteModal'); };

    async function init() {
      try { await getRedirectResult(auth); } catch (e) { console.error(e); }
      renderStaticUI();
      onAuthStateChanged(auth, (u) => { state.user = u; updateAuthUI(); updateUI(); });
      const colRef = collection(db, 'artifacts', PLATFORM_APP_ID, 'public', 'data', 'listings');
      onSnapshot(colRef, (snap) => { state.items = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (el('loadingIndicator')) el('loadingIndicator').classList.add('hidden'); updateUI(); }, (err) => { el('loadingIndicator')?.classList.add('hidden'); showToast("連線受阻，請檢查規則"); });
      el('searchInput')?.addEventListener('input', (e) => { state.searchQuery = e.target.value; resetPage(); });
      el('postForm')?.addEventListener('submit', handlePostSubmit);
      el('termsCheckbox')?.addEventListener('click', toggleTerms);
      el('confirmDeleteBtn')?.addEventListener('click', window.executeDelete);
      el('prevPageBtn')?.addEventListener('click', () => { if(state.currentPage>1){state.currentPage--; updateUI();} });
      el('nextPageBtn')?.addEventListener('click', () => { state.currentPage++; updateUI(); });
      el('fabPostBtn')?.addEventListener('click', () => { if (!state.user) window.openModal('loginPromptModal'); else window.openModal('postModal'); });
      el('formPriceType')?.addEventListener('change', (e) => { if (e.target.value === '台幣') window.openModal('ntdSafetyModal'); });
    }

    function updateAuthUI() {
      const area = el('userProfileArea'), dot = el('authStatusDot'), text = el('authStatusText');
      if (!area || !dot || !text) return;
      if (state.user) { dot.className = "w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse text-left"; text.innerText = state.user.displayName; area.innerHTML = `<button onclick="window.handleLogout()" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-[10px] font-black text-slate-500">登出</button><img src="${state.user.photoURL}" referrerpolicy="no-referrer" class="w-8 h-8 rounded-full border border-amber-600/40 ring-2 ring-amber-600/10">`; }
      else { dot.className = "w-1.5 h-1.5 bg-slate-500 rounded-full text-left"; text.innerText = "訪客模式"; area.innerHTML = `<button onclick="window.handleLogin()" class="bg-amber-600 hover:bg-amber-500 text-slate-950 px-3.5 py-1.5 rounded-lg border border-amber-500/30 text-[11px] font-black flex items-center gap-2 shadow-lg transition-all text-left text-white"><i data-lucide="log-in" class="w-3.5 h-3.5 text-left text-white"></i> 驗證登入</button>`; }
      lucide.createIcons();
    }

    function generateAdHTML(adData, className) {
      return `<div class="bg-slate-900 border border-amber-900/30 rounded-xl flex flex-col items-center justify-center p-6 ${className} text-left"><i data-lucide="megaphone" class="text-slate-800 mb-1 text-left"></i><p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest text-left">品牌位置招聘中 | Line remixroy</p></div>`;
    }

    function renderStaticUI() {
      el('serverFilterContainer').innerHTML = servers.map(s => `<button data-type="server" data-val="${s}" class="filter-btn px-4 py-2 rounded-xl text-[11px] font-black whitespace-nowrap shrink-0 border border-slate-800 transition-all text-white text-left text-white">${s}</button>`).join('');
      el('classFilterContainer').innerHTML = classes.map(c => `<button data-type="class" data-val="${c.id}" class="filter-btn flex items-center gap-2 px-3.5 py-2 rounded-xl text-[11px] font-black whitespace-nowrap shrink-0 border border-slate-800 transition-all text-white text-left text-white"><i data-lucide="${c.icon}" class="w-3.5 h-3.5 text-left text-white"></i>${c.label}</button>`).join('');
      el('formServer').innerHTML = servers.filter(s=>s!=='全部').map(s => `<option value="${s}">${s}</option>`).join('');
      el('categoryTabsContainer').innerHTML = categories.map(cat => `<button data-type="category" data-val="${cat.id}" class="filter-btn flex-1 flex flex-col items-center py-3 gap-1.5 rounded-2xl transition-all text-white text-left text-white"><i data-lucide="${cat.icon}" class="w-5 h-5 text-white text-left text-white"></i><span class="text-[10px] font-black tracking-widest text-left text-white">${cat.label}</span></button>`).join('');
      el('sortFilterContainer').innerHTML = [{id:'newest',label:'最新'},{id:'priceAsc',label:'低價'},{id:'priceDesc',label:'高價'}].map(o => `<button data-type="sort" data-val="${o.id}" class="filter-btn px-3 py-1.5 rounded-lg text-[11px] font-black transition-all border-0 text-white text-left text-white">${o.label}</button>`).join('');
      if (el('adTopContainer')) el('adTopContainer').innerHTML = generateAdHTML(adsConfig.listTop, 'h-24 w-full mb-4');
      document.querySelectorAll('.filter-btn').forEach(btn => { btn.addEventListener('click', (e) => { const {type,val} = e.currentTarget.dataset; if (type==='server') state.selectedServer = val; if (type==='class') state.selectedClass = val; if (type==='category') state.activeTab = val; if (type==='sort') state.sortBy = val; resetPage(); }); });
      lucide.createIcons();
    }

    function updateUI() {
      const now = Date.now();
      let filtered = state.items.filter(item => {
        if (item.createdAt) { const itemTime = item.createdAt.seconds ? item.createdAt.seconds * 1000 : item.createdAt; if ((now - itemTime) > EXPIRE_MS) return false; }
        if (state.activeTab !== 'all' && item.type !== state.activeTab) return false;
        if (state.searchQuery && !String(item.name).toLowerCase().includes(state.searchQuery.toLowerCase())) return false;
        if (state.selectedServer !== '全部' && item.server !== state.selectedServer) return false;
        return true;
      });
      filtered.sort((a,b) => { if (state.sortBy === 'newest') return (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0); if (state.sortBy === 'priceAsc') return a.price - b.price; if (state.sortBy === 'priceDesc') return b.price - a.price; return 0; });
      if(el('displayServerName')) el('displayServerName').innerText = state.selectedServer;
      if(el('displayItemCount')) el('displayItemCount').innerText = `${filtered.length} ITEMS`;
      const lineBtn = el('lineGroupLink'); if (lineBtn) { if (state.selectedServer !== '全部' && serverLineLinks[state.selectedServer]) { lineBtn.href = serverLineLinks[state.selectedServer]; lineBtn.classList.replace('hidden', 'flex'); } else { lineBtn.classList.replace('flex', 'hidden'); } }
      const totalPages = Math.max(1, Math.ceil(filtered.length/state.itemsPerPage)); state.currentPage = Math.min(state.currentPage, totalPages);
      const startIndex = (state.currentPage-1)*state.itemsPerPage; const pagedItems = filtered.slice(startIndex, startIndex+state.itemsPerPage);
      const container = el('itemsContainer'), emptyState = el('emptyState');
      if (container && emptyState) {
        if (pagedItems.length > 0) { container.classList.remove('hidden'); emptyState.classList.add('hidden'); container.innerHTML = pagedItems.map((item, idx) => { let h = generateItemHTML(item); if((idx+1)%5===0) h += generateAdHTML(adsConfig.listInterleaved, 'h-24 w-full my-4'); return h; }).join(''); }
        else { container.classList.add('hidden'); emptyState.classList.remove('hidden'); }
      }
      const pageCont = el('paginationContainer'); if (pageCont) { if (totalPages > 1) { pageCont.classList.remove('hidden'); if(el('currentPageDisplay')) el('currentPageDisplay').innerText = state.currentPage; if(el('nextPageBtn')) el('nextPageBtn').disabled = state.currentPage === totalPages; } else { pageCont.classList.add('hidden'); } }
      updateFilterButtonStyles(); lucide.createIcons();
    }

    function resetPage() { state.currentPage = 1; updateUI(); }

    function generateItemHTML(item) {
      const isOwner = !!(state.user && state.user.uid === item.userId);
      const timeStr = item.createdAt ? formatTime(item.createdAt.seconds * 1000) : '剛剛';
      return `
        <div class="bg-slate-900/90 border rounded-2xl p-4 flex justify-between items-center text-left ${isOwner ? 'border-blue-900 bg-blue-950/20' : 'border-slate-800'} text-left text-white shadow-lg">
          <div class="flex gap-4 items-center flex-1 min-w-0 text-left">
            <div class="w-14 h-14 rounded-2xl bg-slate-950 border-2 flex items-center justify-center shrink-0 border-slate-800 text-left"><i data-lucide="${item.type==='weapon'?'sword':item.type==='armor'?'shield':item.type==='item'?'coins':'wand-2'}" class="w-7 h-7 text-left text-white"></i></div>
            <div class="flex-1 min-w-0 text-left">
              <div class="flex items-center gap-2 text-left"><span class="text-[9px] font-black px-1.5 py-0.5 bg-amber-900/30 text-amber-500 rounded border border-amber-900/40 uppercase shrink-0 text-left text-white">${item.server}</span><h3 class="font-bold text-slate-100 text-[15px] truncate text-left text-white">${item.name}</h3></div>
              <div class="flex items-center gap-2 mt-2 w-full overflow-hidden text-left"><span class="text-[9px] text-slate-500 font-bold shrink-0 text-left">${timeStr}</span><span class="text-[11px] text-slate-400 truncate text-left text-white">賣家: ${escapeHtml(item.sellerName || '冒險者')} ${isOwner ? '<span class="text-blue-500 font-black">(您)</span>' : ''}</span></div>
            </div>
          </div>
          <div class="text-right shrink-0 pl-2 text-left">
            <p class="text-lg font-black text-amber-400 tracking-tight text-left text-white">${Number(item.price).toLocaleString()} <span class="text-[10px] font-bold opacity-60 text-white">${item.priceType || '金幣'}</span></p>
            ${isOwner ? `<button onclick="window.openDeleteModal('${item.id}')" class="mt-2 bg-slate-800 text-red-400 border border-slate-700 text-[10px] px-3.5 py-1 rounded-xl font-black text-center text-white">下架</button>` : `<button onclick="window.openContactModalById('${item.id}')" class="mt-2 bg-amber-600 text-slate-950 text-[11px] px-4 py-1.5 rounded-xl font-black shadow-lg text-center text-white">聯絡</button>`}
          </div>
        </div>`;
    }

    window.openContactModalById = (id) => { const item = state.items.find(x => x.id === id); if(!item) return; state.contactTarget = item; el('contactTypeDisplay').innerText = `${item.contactType} ID`; el('contactValueDisplay').innerText = item.contactValue; window.openModal('contactModal'); lucide.createIcons(); };
    function formatTime(ms) { const diff = (Date.now() - ms) / 1000; if (diff < 60) return '剛剛'; if (diff < 3600) return Math.floor(diff/60) + '分鐘前'; return Math.floor(diff/3600) + '小時前'; }
    function updateFilterButtonStyles() { document.querySelectorAll('.filter-btn').forEach(btn => { const {type,val} = btn.dataset; let isActive = (type==='server'&&state.selectedServer===val) || (type==='class'&&state.selectedClass===val) || (type==='category'&&state.activeTab===val) || (type==='sort'&&state.sortBy===val); if(type==='server'||type==='class') { btn.className = `filter-btn ${type==='class'?'flex items-center gap-2':''} px-4 py-2 rounded-xl text-[10px] font-black whitespace-nowrap shrink-0 border border-slate-800 transition-all ${isActive ? 'bg-amber-600/20 text-amber-400 border-amber-600/50 shadow-inner text-left text-white' : 'text-left text-white'}`; } else if(type==='category') { btn.className = `filter-btn flex-1 flex flex-col items-center py-3 gap-1.5 rounded-2xl transition-all ${isActive ? 'bg-slate-800 text-amber-400 shadow-lg scale-105 z-10 text-left text-white' : 'text-slate-600 text-left text-white text-white'}`; } else { btn.className = `filter-btn px-3.5 py-1.5 rounded-lg text-[10px] font-black border border-slate-800 transition-all ${isActive ? 'bg-amber-600 text-slate-950 border-amber-600 shadow-md scale-105 text-left text-white' : 'bg-slate-800/50 text-slate-500 text-left text-white'}`; } }); }
    function updateFormClassStyles() { document.querySelectorAll('.form-class-btn').forEach(btn => { const isActive = state.postFormClasses.includes(btn.dataset.val); btn.className = `form-class-btn flex flex-col items-center py-3 rounded-2xl border border-slate-800 transition-all ${isActive ? 'bg-amber-600/20 border-amber-500 text-amber-500 shadow-inner' : 'bg-slate-800'}`; }); }
    function toggleTerms() { state.agreedToTerms = !state.agreedToTerms; const box=el('termsBoxUI'), icon=el('termsCheckIcon'), btn=el('submitBtn'); if (state.agreedToTerms) { box?.classList.replace('bg-slate-950','bg-amber-500'); icon?.classList.remove('hidden'); btn.disabled=false; btn.className='w-full py-4.5 rounded-2xl font-black text-lg shadow-xl bg-gradient-to-r from-amber-500 to-amber-700 text-slate-950 text-center text-white'; } else { box?.classList.replace('bg-amber-500','bg-slate-950'); icon?.classList.add('hidden'); btn.disabled=true; btn.className='w-full py-4.5 rounded-2xl font-black text-lg bg-slate-800 text-slate-500 cursor-not-allowed text-center text-white'; } }
    async function handlePostSubmit(e) { e.preventDefault(); if (!state.user || !state.agreedToTerms) return; const btn=el('submitBtn'); btn.innerText='正在刊登...'; btn.disabled=true; const data = { server: el('formServer').value, type: el('formType').value, name: el('formName').value, level: Number(el('formLevel').value), rarity: el('formRarity').value, price: Number(el('formPrice').value), priceType: el('formPriceType').value, contactType: state.contactType, contactValue: el('formContactValue').value, sellerName: el('formSellerName').value, createdAt: serverTimestamp(), userId: state.user.uid, userEmail: state.user.email, isVerified: false }; try { await addDoc(collection(db, 'artifacts', PLATFORM_APP_ID, 'public', 'data', 'listings'), data); window.closeModal('postModal'); el('postForm').reset(); showToast('刊登成功！'); } catch (err) { alert("刊登失敗，請檢查權限"); } finally { btn.innerText='發布刊登'; btn.disabled=false; } }
    async function handleCopy(){ if(!state.contactTarget)return; const t=state.contactTarget.contactValue; try { await navigator.clipboard.writeText(t); } catch(e) { const input=document.createElement("input"); input.value=t; document.body.appendChild(input); input.select(); document.execCommand("copy"); document.body.removeChild(input); } el('copyBtn').className='w-full py-4.5 rounded-2xl font-black bg-green-600 text-white flex items-center justify-center gap-2 shadow-lg text-center'; el('copyText').innerText='複製成功！'; }
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])); }
    let toastT; function showToast(m){ const t=el('toast-container'); if(!t) return; el('toast-msg').innerText=m; t.classList.remove('opacity-0','-translate-y-4','pointer-events-none'); t.classList.add('opacity-100','translate-y-0'); clearTimeout(toastT); toastT=setTimeout(()=>{t.classList.add('opacity-0','-translate-y-4','pointer-events-none'); t.classList.remove('opacity-100','translate-y-0');},3000); }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
